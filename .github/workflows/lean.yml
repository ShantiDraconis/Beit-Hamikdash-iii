name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Proibir sorry, admit, native_decide e axiomas novos
        run: python3 scripts/verificar_honestidade.py

      - name: Instalar Lean e baixar o Mathlib pré-compilado
        timeout-minutes: 15
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: Build
        timeout-minutes: 25
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log

      - name: Publicar erros como anotações
        if: always()
        run: test -f build.log && python3 scripts/anotar_erros.py build.log || true

      - name: Auditoria de axiomas
        run: bash scripts/auditar_axiomas.sh
